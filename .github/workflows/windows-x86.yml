name: Windows x86
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - name: Build native Visual Studio project
        run: msbuild "TinyX86.vcxproj" /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /v:minimal
      - name: Configure
        run: cmake -S . -B build-ci -A Win32
      - name: Build
        run: cmake --build build-ci --config Release --parallel
      - name: Test
        run: ctest --test-dir build-ci -C Release --output-on-failure
