name: Cross-Platform CI & GitHub Pages Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  cmake-matrix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu Linux (GCC)
            os: ubuntu-latest
            cc: gcc
            cmake_args: ""
          - name: Ubuntu Linux (Clang)
            os: ubuntu-latest
            cc: clang
            cmake_args: ""
          - name: macOS (Apple Clang)
            os: macos-latest
            cc: clang
            cmake_args: ""
          - name: Windows x86 (Win32 MSVC)
            os: windows-latest
            cc: cl
            cmake_args: "-A Win32"
          - name: Windows x64 (MSVC)
            os: windows-latest
            cc: cl
            cmake_args: "-A x64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
        run: cmake -S . -B build-ci ${{ matrix.cmake_args }} -DCMAKE_BUILD_TYPE=Release

      - name: Build TinyX86 & Tests
        run: cmake --build build-ci --config Release --parallel

      - name: Run Integration Tests (CTest)
        run: ctest --test-dir build-ci -C Release --output-on-failure

  web-debugger:
    name: Web Debugger Build (C11 -> WASM + Node.js 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile C11 Core to WebAssembly (wasi-sdk)
        run: |
          curl -sL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz | tar xz -C /tmp
          mkdir -p public
          /tmp/wasi-sdk-24.0-x86_64-linux/bin/clang -std=c11 -O2 -Iinclude -Iinclude/compat \
            -Wl,--export-dynamic -Wl,--no-entry \
            core/TinyX86.c core/disasm.c core/PELoader.c core/PETools.c core/debugger.c core/wasm_bridge.c \
            -lm -o public/tinyx86.wasm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Web Workbench
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: web-debugger
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
